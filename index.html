
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniShorts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
    }
    header {
      padding: 22px;
      border-bottom: 1px solid #292936;
      font-size: 24px;
      font-weight: bold;
    }
    header span { color: #a78bfa; }
    main {
      width: min(650px, 92%);
      margin: 55px auto;
    }
    h1 { font-size: 38px; margin-bottom: 10px; }
    p { color: #aaaaba; line-height: 1.6; }
    .panel {
      background: #15151f;
      padding: 24px;
      border: 1px solid #303041;
      border-radius: 18px;
      margin-top: 25px;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #38384b;
      border-radius: 10px;
      background: #0d0d16;
      color: white;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: #7c3aed;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    #resultado {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
    .nota {
      font-size: 13px;
      color: #88889b;
    }
  </style>
</head>
<body>
  <header>🎬 Mini<span>Shorts</span></header>

  <main>
    <h1>De video largo a clips cortos.</h1>
    <p>
      Prepará tus Shorts en formato vertical.
      Elegí la duración y organizá tus clips.
    </p>

    <section class="panel">
      <label for="url">Link de YouTube</label>
      <input id="url" type="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required>

      <label for="duracion">Duración de cada Short</label>
      <select id="duracion">
        <option value="15">15 segundos</option>
        <option value="30" selected>30 segundos</option>
        <option value="45">45 segundos</option>
        <option value="60">60 segundos</option>
        <option value="90">90 segundos</option>
      </select>

      <label for="modo">Tipo de división</label>
      <select id="modo">
        <option value="consecutivo">
          Dividir en partes consecutivas
        </option>
        <option value="momentos">
          Buscar los mejores momentos (requiere IA)
        </option>
      </select>

      <button onclick="preparar()">Preparar mis Shorts</button>
      <div id="resultado" aria-live="polite"></div>
    </section>

    <p class="nota">
      MiniShorts · Usá videos propios o que tengas
      autorización para editar.
    </p>
  </main>

  <script>
    function preparar() {
      const url = document.getElementById("url").value.trim();
      const duracion = document.getElementById("duracion").value;
      const modo = document.getElementById("modo").value;
      const resultado = document.getElementById("resultado");

      let videoId = "";

      try {
        const u = new URL(url);

        if (u.hostname === "youtu.be") {
          videoId = u.pathname.slice(1).split("/")[0];
        } else if (
          ["youtube.com", "www.youtube.com",
           "m.youtube.com", "youtube-nocookie.com",
           "www.youtube-nocookie.com"].includes(u.hostname)
        ) {
          if (u.pathname === "/watch") {
            videoId = u.searchParams.get("v") || "";
          } else {
            const match = u.pathname.match(
              /^\/(?:shorts|embed)\/([^/]+)/
            );
            if (match) videoId = match[1];
          }
        }
      } catch (_) {}

      if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        resultado.textContent =
          "Pegá un enlace válido de un video de YouTube.";
        return;
      }

      if (modo === "momentos") {
        resultado.textContent =
          "La detección de mejores momentos necesita conectar " +
          "un servicio de IA. Todavía no está configurado.";
        return;
      }

      const segundos = Number(duracion);

      resultado.innerHTML = "";

      const titulo = document.createElement("p");
      titulo.textContent =
        "Video identificado. Cada clip tendrá " +
        segundos + " segundos como máximo.";
      resultado.appendChild(titulo);

      const aviso = document.createElement("p");
      aviso.textContent =
        "Esta página es la interfaz. Para generar y descargar " +
        "los archivos MP4 hay que conectar el procesador de video.";
      resultado.appendChild(aviso);

      const enlace = document.createElement("a");
      enlace.href = "https://www.youtube.com/watch?v=" + videoId;
      enlace.target = "_blank";
      enlace.rel = "noopener noreferrer";
      enlace.textContent = "Abrir video original en YouTube";
      enlace.style.color = "#c4b5fd";
      resultado.appendChild(enlace);
    }
  </script>
</body>
</html>
