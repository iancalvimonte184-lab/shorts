
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniShorts</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b0b12;color:#fff;
  font-family:Arial,sans-serif
}
header{
  padding:22px;border-bottom:1px solid #292936;
  font-size:24px;font-weight:bold
}
header span{color:#a78bfa}
main{max-width:650px;margin:40px auto;padding:20px}
.panel{
  background:#15151f;border:1px solid #343448;
  padding:24px;border-radius:18px
}
p{color:#b8b8c8;line-height:1.6}
label{display:block;margin:18px 0 8px}
input,select{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #38384b;background:#0d0d16;
  color:white;font-size:15px
}
button{
  width:100%;padding:15px;margin-top:20px;
  border:0;border-radius:10px;background:#7c3aed;
  color:white;font-weight:bold;font-size:16px
}
button:disabled{opacity:.5}
#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>🎬 Mini<span>Shorts</span></header>
<main>
  <h1>De video largo a Shorts.</h1>
  <p>Subí un video, elegí la duración y descargá tus clips verticales.</p>

  <section class="panel">
    <form id="form">
      <label for="video">Elegí tu archivo de video</label>
      <input id="video" name="video" type="file"
        accept="video/*" required>

      <label for="seconds">Duración de cada clip</label>
      <select id="seconds" name="seconds">
        <option value="15">15 segundos</option>
        <option value="30" selected>30 segundos</option>
        <option value="45">45 segundos</option>
        <option value="60">60 segundos</option>
        <option value="90">90 segundos</option>
      </select>

      <button id="submit" type="submit">Generar Shorts</button>
    </form>
    <p id="status" role="status"></p>
  </section>
</main>

<script>
const API_URL = "https://TU-SERVIDOR.onrender.com";

const form = document.getElementById("form");
const button = document.getElementById("submit");
const status = document.getElementById("status");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const file = document.getElementById("video").files[0];

  if (!file) {
    status.textContent = "Primero elegí un video.";
    return;
  }

  if (file.size > 300 * 1024 * 1024) {
    status.textContent = "El archivo supera los 300 MB.";
    return;
  }

  const data = new FormData();
  data.append("video", file);
  data.append("seconds", document.getElementById("seconds").value);

  button.disabled = true;
  status.textContent = "Procesando el video. No cierres esta página…";

  try {
    const response = await fetch(API_URL + "/api/split", {
      method: "POST",
      body: data
    });

    if (!response.ok) {
      let message = "No se pudo procesar el video.";
      try {
        const error = await response.json();
        message = error.detail || message;
      } catch (_) {}
      throw new Error(message);
    }

    const blob = await response.blob();
    const downloadUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = downloadUrl;
    link.download = "minishorts.zip";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
    status.textContent = "¡Listo! Se descargó el ZIP con tus Shorts.";
  } catch (error) {
    status.textContent =
      "Error: " + error.message +
      "\nComprobá que el servidor esté publicado y disponible.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
